<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio de 1 Juan</title>
<meta name="description" content="Cuestionario de 1 Juan capítulos 1 al 5 (Reina-Valera 1960): una pregunta a la vez, con respuesta, versículo y contexto para el evaluador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --surface:#ffffff; --surface2:#f3efe7; --line:#e3dccf; --line2:#d6ccbb;
  --text:#1c2230; --muted:#6a6f7b; --accent:#2c4a8a; --accent-ink:#ffffff; --accent-soft:#e9eef8;
  --gold:#a8771f; --verse-bg:#fbf6ea; --verse-line:#e6d3a8;
  --ok:#1d7f48; --ok-soft:#e5f3ea; --bad:#b93a32; --bad-soft:#fbe9e6;
  --shadow:0 1px 2px rgba(28,34,48,.05),0 8px 24px rgba(28,34,48,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121419; --surface:#1b1e26; --surface2:#222632; --line:#2c3140; --line2:#394054;
  --text:#ebe7df; --muted:#9aa0ad; --accent:#8ea6ff; --accent-ink:#0f1320; --accent-soft:rgba(142,166,255,.12);
  --gold:#ddb45f; --verse-bg:rgba(221,180,95,.07); --verse-line:rgba(221,180,95,.35);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1b1e26; --surface2:#222632; --line:#2c3140; --line2:#394054;
  --text:#ebe7df; --muted:#9aa0ad; --accent:#8ea6ff; --accent-ink:#0f1320; --accent-soft:rgba(142,166,255,.12);
  --gold:#ddb45f; --verse-bg:rgba(221,180,95,.07); --verse-line:rgba(221,180,95,.35);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:92px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* Encabezado */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 17px Lora,serif;flex:none}
.brand{min-width:0}
.brand h1{margin:0;font:600 19px/1.2 Lora,serif}
.brand p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;flex:none}

/* Filtros */
.filters{padding:14px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.frow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.frow input,.frow select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;min-width:0}
.frow input:focus,.frow select:focus{border-color:var(--accent)}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.tbtn:hover{border-color:var(--line2)}

/* Progreso */
.prog{display:flex;align-items:center;gap:12px;margin:16px 0 10px;font-size:13.5px}
.prog b{font-weight:700}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.score{display:flex;gap:6px}
.pill{font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Tarjeta */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.t{background:var(--accent-soft);color:var(--accent)}
.q{font:600 21px/1.4 Lora,serif;margin:0 0 18px}
.opts{display:grid;gap:9px;margin-bottom:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2);background:var(--surface2)}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:13px;color:var(--muted)}
.opt .mk{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .l{background:var(--ok);color:#fff}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.wrong .mk{color:var(--bad)}
.locked .opt{cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.judge{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.judge button{flex:1;min-width:140px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;font-weight:600}
.judge .y.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.judge .n.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

.showbtn{width:100%;margin-top:16px;border:1.5px dashed var(--line2);background:none;border-radius:12px;padding:12px;font-weight:600;color:var(--accent)}
.ans{margin-top:18px;display:grid;gap:10px}
.box{border-radius:12px;padding:14px 16px}
.box h4{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.box p{margin:0}
.box.r{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.box.r h4{color:var(--ok)}
.box.r p{font-weight:600;font-size:16px}
.box.v{background:var(--verse-bg);border:1px solid var(--verse-line)}
.box.v h4{color:var(--gold)}
.box.v p{font:italic 400 16.5px/1.65 Lora,Georgia,serif}
.box.v sup{font:700 10.5px Inter,sans-serif;color:var(--gold);margin-right:3px;font-style:normal}
.vh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.vh h4{margin:0}
.vbtn{margin-left:auto;border:1px solid var(--verse-line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--gold);white-space:nowrap}
.vbtn:disabled{opacity:.6;cursor:default}
.vres{margin-top:10px;padding-top:10px;border-top:1px dashed var(--verse-line);font-size:13.5px}
.vres.ok{color:var(--ok);font-weight:600}
.vres.err{color:var(--muted)}
.vres.diff{color:var(--bad)}
.vres .api{margin:6px 0 0;color:var(--text);font:italic 14.5px/1.6 Lora,serif}
.vres mark{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 2px;font-style:normal}
.box.c{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.box.c h4{color:var(--accent)}
.box.c p{font-size:14.5px}
.empty{text-align:center;color:var(--muted);padding:50px 10px}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
nav .wrap{display:flex;gap:8px;align-items:center}
.nbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;display:flex;align-items:center;gap:6px}
.nbtn.main{margin-left:auto;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:12px 22px}
.nbtn:disabled{opacity:.4;cursor:default}
.keys{font-size:12px;color:var(--muted);margin:0 auto}

/* Panel de números */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(680px,calc(100% - 24px));max-height:80vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,18,.5)}
.dh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font:600 17px Lora,serif}
.dh button{margin-left:auto}
.legend{display:flex;gap:14px;padding:10px 18px 0;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;padding:14px 18px 18px;overflow:auto;max-height:calc(80vh - 110px)}
.grid button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:13px}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.seen{border-color:var(--line2)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}

@media (max-width:640px){
  .top{flex-wrap:wrap}
  .hright{width:100%;margin-left:0}
  .seg{flex:1}
  .seg button{flex:1}
  .frow{grid-template-columns:1fr 1fr}
  .frow .tbtn{grid-column:span 2}
  .card{padding:18px;border-radius:16px}
  .q{font-size:18.5px}
  .keys{display:none}
  .nbtn{padding:12px 13px}
  .nbtn.main{padding:12px 18px}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="logo">1J</div>
    <div class="brand">
      <h1>1 Juan · Capítulos 1–5</h1>
      <p>Cuestionario para el evaluador · Reina-Valera 1960</p>
    </div>
    <div class="hright">
      <div class="seg" role="tablist">
        <button id="mEval" class="on">Evaluador</button>
        <button id="mExam">Examen</button>
      </div>
      <button class="icon" id="bTheme" title="Cambiar tema">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="filters">
    <div class="chips" id="caps"></div>
    <div class="frow">
      <select id="fType"><option value="">Todos los tipos</option></select>
      <input id="fSearch" type="search" placeholder="Buscar (ej. 4:8, luz)">
      <button class="tbtn" id="bShuffle">⤨ Barajar</button>
    </div>
  </section>

  <div class="prog">
    <span id="pos"></span>
    <div class="bar"><i id="barFill"></i></div>
    <div class="score"><span class="pill ok" id="sOk">✔ 0</span><span class="pill bad" id="sBad">✘ 0</span></div>
  </div>

  <div id="stage"></div>
</main>

<nav class="bottom">
  <div class="wrap">
    <button class="nbtn" id="bPrev">← <span>Anterior</span></button>
    <button class="nbtn" id="bGrid">☷ <span id="gridLbl">Ir a…</span></button>
    <span class="keys">← → navegar · Espacio: respuesta · A–D: elegir</span>
    <button class="nbtn main" id="bNext"><span>Siguiente</span> →</button>
  </div>
</nav>

<dialog id="dlg">
  <div class="dh"><h3>Ir a la pregunta</h3><button class="tbtn" id="bReset">Reiniciar marcas</button><button class="icon" id="bClose" style="margin-left:8px">✕</button></div>
  <div class="legend"><span style="--c:var(--ok)">Acertada</span><span style="--c:var(--bad)">Fallada</span><span style="--c:var(--line2)">Vista</span><span style="--c:var(--surface2)">Pendiente</span></div>
  <div class="grid" id="grid"></div>
</dialog>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const LET = "ABCD";
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("1jn-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("1jn-" + k, JSON.stringify(v)); } catch (e) {} }
};

// Opciones barajadas de forma fija (misma letra para evaluador y participantes)
Q.forEach((q, i) => {
  q.id = i + 1;
  if (!q.o) return;
  const arr = q.o.map((t, k) => ({ t, ok: k === 0 }));
  if (arr.length === 2) arr.sort(a => a.t === "Verdadero" ? -1 : 1);
  else { let s = i + 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let j = arr.length - 1; j > 0; j--) { const x = Math.floor(r() * (j + 1)); [arr[j], arr[x]] = [arr[x], arr[j]]; } }
  q.o = arr;
});

function verses(ref) {
  const out = [];
  ref.split(",").forEach(p => {
    const [cap, rest] = p.trim().split(":");
    const [a, b] = rest.split("-").map(Number);
    for (let v = a; v <= (b || a); v++) if (V[cap + ":" + v]) out.push([v, V[cap + ":" + v]]);
  });
  return out;
}

// Estado
let mode = store.get("mode", "evaluador");
let res = store.get("res", {});       // id -> {k: opción elegida | null, ok: bool}
let seen = new Set(store.get("seen", []));
let shown = new Set();                // respuestas reveladas en modo examen
let cap = "", order = Q.map((_, i) => i), list = [], pos = 0;

function filter(keepId) {
  const t = $("#fType").value, s = norm($("#fSearch").value.trim());
  list = order.map(i => Q[i]).filter(q =>
    (cap === "" || String(q.c) === cap) && (t === "" || q.t === t) &&
    (!s || norm([q.q, q.a, q.x, q.r, verses(q.r).map(v => v[1]).join(" ")].join(" ")).includes(s)));
  const k = keepId ? list.findIndex(q => q.id === keepId) : -1;
  pos = k >= 0 ? k : 0;
  render();
}

function render() {
  const q = list[pos];
  $("#pos").innerHTML = list.length ? `Pregunta <b>${pos + 1}</b> de ${list.length}` : "Sin resultados";
  $("#barFill").style.width = list.length ? ((pos + 1) / list.length * 100) + "%" : "0";
  $("#bPrev").disabled = pos <= 0;
  $("#bNext").disabled = pos >= list.length - 1;
  score();
  if (!q) { $("#stage").innerHTML = `<div class="card empty">No hay preguntas con esos filtros.</div>`; return; }
  seen.add(q.id); store.set("seen", [...seen]); store.set("last", q.id);

  const r = res[q.id];
  const open = mode === "evaluador" || shown.has(q.id) || r;
  const vs = verses(q.r);

  let body = "";
  if (q.o) {
    body = `<div class="opts${r ? " locked" : ""}">${q.o.map((o, k) => {
      let cls = "", mk = "";
      if (r && r.k === k) { cls = o.ok ? "correct" : "wrong"; mk = o.ok ? "✔ Correcta" : "✘ Elegida"; }
      else if (o.ok && (open)) { cls = "correct"; mk = "✔ Correcta"; }
      return `<button class="opt ${cls}" data-k="${k}"><span class="l">${LET[k]}</span><span>${esc(o.t)}</span><span class="mk">${mk}</span></button>`;
    }).join("")}</div>
    <p class="hint">${r ? "Respuesta registrada. Toca otra opción para corregir la marca." : mode === "evaluador" ? "Toca la opción que eligió el participante para registrarla." : "Toca una opción para responder."}</p>`;
  } else if (open) {
    body = `<div class="judge"><button class="y${r && r.ok ? " on" : ""}" data-j="1">✔ Respondió bien</button><button class="n${r && !r.ok ? " on" : ""}" data-j="0">✘ Respondió mal</button></div>`;
  }

  const ans = open ? `<div class="ans">
      <div class="box r"><h4>Respuesta correcta</h4><p>${esc(q.a)}</p></div>
      ${vs.length ? `<div class="box v"><div class="vh"><h4>1 Juan ${q.r} · RVR1960</h4><button class="vbtn" data-verify ${vcheck[q.id]?.state === "loading" ? "disabled" : ""}>${vcheck[q.id] ? "Verificar de nuevo" : "Verificar con API"}</button></div><p>${vs.map(([n, t]) => `<sup>${n}</sup>${esc(t)}`).join(" ")}</p>${verifyHtml(vcheck[q.id])}</div>` : ""}
      <div class="box c"><h4>Contexto · ¿Qué quiso decir Juan?</h4><p>${esc(q.x)}</p></div>
    </div>` : `<button class="showbtn" id="bShow">Mostrar respuesta (Espacio)</button>`;

  $("#stage").innerHTML = `<article class="card">
    <div class="meta"><span class="tag">#${q.id}</span><span class="tag">${q.c ? "Capítulo " + q.c : "General"}</span><span class="tag">1 Juan ${q.r}</span><span class="tag t">${TIPOS[q.t]}</span></div>
    <h2 class="q">${esc(q.q)}</h2>
    ${body}${ans}
  </article>`;
}

// Contraste con la API de bolls.life (RVR1960, libro 62 = 1 Juan)
const vcheck = {}, apiCache = {};
const clean = s => s.replace(/<[^>]+>/g, "").replace(/\s+/g, " ").replace(/\s+([,;:.)?!])/g, "$1").trim();

async function chapter(c) {
  if (!apiCache[c]) apiCache[c] = fetch(`https://bolls.life/get-text/RV1960/62/${c}/`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(a => Object.fromEntries(a.map(v => [v.verse, clean(v.text)])))
    .catch(e => { delete apiCache[c]; throw e; });
  return apiCache[c];
}

async function verify(q) {
  vcheck[q.id] = { state: "loading" }; render();
  try {
    const diffs = [];
    for (const p of q.r.split(",")) {
      const [c] = p.trim().split(":");
      const api = await chapter(c);
      verses(p.trim()).forEach(([n, t]) => { if (clean(t) !== api[n]) diffs.push({ n, mine: clean(t), api: api[n] || "(no encontrado)" }); });
    }
    vcheck[q.id] = diffs.length ? { state: "diff", diffs } : { state: "ok" };
  } catch (e) {
    vcheck[q.id] = { state: "err" };
  }
  if (list[pos] && list[pos].id === q.id) render();
}

// Marca en rojo las palabras del texto de la API que no están en el de la página
function markDiff(mine, api) {
  const a = mine.split(" "), b = api.split(" ");
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (j < b.length) {
    if (i < a.length && a[i] === b[j]) { out.push(esc(b[j])); i++; j++; }
    else if (i < a.length && L[i + 1][j] >= L[i][j + 1]) i++;
    else { out.push(`<mark>${esc(b[j])}</mark>`); j++; }
  }
  return out.join(" ");
}

function verifyHtml(v) {
  if (!v) return "";
  if (v.state === "loading") return `<div class="vres err">Consultando bolls.life…</div>`;
  if (v.state === "err") return `<div class="vres err">No se pudo conectar con la API. Revisa la conexión e inténtalo de nuevo.</div>`;
  if (v.state === "ok") return `<div class="vres ok">✔ Coincide palabra por palabra con la RVR1960 (fuente: bolls.life)</div>`;
  return `<div class="vres diff">✘ Diferencias con la RVR1960 de bolls.life:${v.diffs.map(d =>
    `<p class="api"><sup>${d.n}</sup>${markDiff(d.mine, d.api)}</p>`).join("")}</div>`;
}

function score() {
  let ok = 0, bad = 0;
  for (const id in res) res[id].ok ? ok++ : bad++;
  $("#sOk").textContent = "✔ " + ok; $("#sBad").textContent = "✘ " + bad;
}

function mark(id, val) { if (val === null) delete res[id]; else res[id] = val; store.set("res", res); render(); }

function pick(k) {
  const q = list[pos]; if (!q || !q.o || !q.o[k]) return;
  const r = res[q.id];
  if (r && r.k === k) mark(q.id, null);              // tocar la misma opción quita la marca
  else mark(q.id, { k, ok: q.o[k].ok });
}

function go(d) { const n = pos + d; if (n >= 0 && n < list.length) { pos = n; render(); scrollTo({ top: 0, behavior: "smooth" }); } }

function toggleShow() {
  const q = list[pos]; if (!q || mode === "evaluador") return;
  shown.has(q.id) ? shown.delete(q.id) : shown.add(q.id); render();
}

function setMode(m) {
  mode = m; store.set("mode", m); shown.clear();
  $("#mEval").classList.toggle("on", m === "evaluador");
  $("#mExam").classList.toggle("on", m === "examen");
  render();
}

function openGrid() {
  $("#grid").innerHTML = list.map((q, i) => {
    const r = res[q.id];
    const cls = r ? (r.ok ? "ok" : "bad") : seen.has(q.id) ? "seen" : "";
    return `<button class="${cls}${i === pos ? " cur" : ""}" data-i="${i}">${q.id}</button>`;
  }).join("");
  $("#dlg").showModal();
}

// Filtros de capítulo
const CAPS = [["", "Todos"], ["0", "General"], ["1", "Cap. 1"], ["2", "Cap. 2"], ["3", "Cap. 3"], ["4", "Cap. 4"], ["5", "Cap. 5"]];
$("#caps").innerHTML = CAPS.map(([v, l]) => `<button class="chip${v === "" ? " on" : ""}" data-c="${v}">${l}</button>`).join("");
$("#caps").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cap = b.dataset.c;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  filter();
};
Object.entries(TIPOS).forEach(([k, v]) => $("#fType").insertAdjacentHTML("beforeend", `<option value="${k}">${v}</option>`));
$("#fType").onchange = () => filter();
$("#fSearch").oninput = () => filter();
$("#bShuffle").onclick = () => {
  const b = $("#bShuffle");
  if (b.dataset.on) { order = Q.map((_, i) => i); delete b.dataset.on; b.textContent = "⤨ Barajar"; }
  else { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } b.dataset.on = 1; b.textContent = "↺ Orden original"; }
  filter();
};

// Tarjeta
$("#stage").onclick = e => {
  if (e.target.closest("[data-verify]")) return verify(list[pos]);
  const o = e.target.closest(".opt"); if (o) return pick(+o.dataset.k);
  const j = e.target.closest("[data-j]");
  if (j) { const q = list[pos], v = j.dataset.j === "1", r = res[q.id]; return mark(q.id, r && r.ok === v ? null : { k: null, ok: v }); }
  if (e.target.closest("#bShow")) toggleShow();
};

// Navegación
$("#bPrev").onclick = () => go(-1);
$("#bNext").onclick = () => go(1);
$("#bGrid").onclick = openGrid;
$("#bClose").onclick = () => $("#dlg").close();
$("#dlg").onclick = e => { if (e.target === $("#dlg")) $("#dlg").close(); };
$("#grid").onclick = e => { const b = e.target.closest("[data-i]"); if (b) { pos = +b.dataset.i; $("#dlg").close(); render(); } };
$("#bReset").onclick = () => { if (confirm("¿Borrar todas las marcas de acierto/fallo?")) { res = {}; seen = new Set(); store.set("res", res); store.set("seen", []); $("#dlg").close(); render(); } };
$("#mEval").onclick = () => setMode("evaluador");
$("#mExam").onclick = () => setMode("examen");

document.addEventListener("keydown", e => {
  if (e.target.matches("input,select") || $("#dlg").open) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleShow(); }
  else { const k = "abcd".indexOf(e.key.toLowerCase()); if (k >= 0) pick(k); }
});

// Deslizar en el móvil
let tx = null, ty = null;
$("#stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#stage").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  tx = null;
});

// Tema
const root = document.documentElement;
const savedTheme = store.get("theme", null);
if (savedTheme) root.dataset.theme = savedTheme;
$("#bTheme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
};

setMode(mode);
filter(store.get("last", null));
</script>
</body>
</html>
